services:
  server:
    environment:
      LLM_SERVICE_URL: http://llm:8000
    depends_on:
      llm:
        condition: service_healthy

  llm:
    profiles: ["llm"]
    build:
      context: ./llm
      dockerfile: Dockerfile
    container_name: tender-llm
    gpus: all
    environment:
      MODEL_REPO_ID: ${MODEL_REPO_ID}
      ADAPTER_SUBFOLDER: ${ADAPTER_SUBFOLDER}
      BASE_MODEL: ${BASE_MODEL}
      HF_TOKEN: ${HF_TOKEN}
      TRUST_REMOTE_CODE: "true"
      USE_4BIT: "true"
      STARTUP_LOAD: "true"
      MAX_NEW_TOKENS: "512"
      TEMPERATURE: "0.0"
      TOP_P: "0.95"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    ports:
      - "8000:8000"
    volumes:
      - hf_cache:/cache/huggingface
    restart: unless-stopped

volumes:
  hf_cache: